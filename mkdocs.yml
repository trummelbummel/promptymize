site_name: auto-prompt
repo_url: https://github.com/trummelbummel/auto-prompt
site_url: https://trummelbummel.github.io/auto-prompt
site_description: All models have specific prompt guidelines. This project enables automatic adaptation of prompts to best practices based on documentation and advanced prompt techniques from the literature.
site_author: Theresa Fruhwuerth
edit_uri: edit/main/docs/
repo_name: trummelbummel/auto-prompt
copyright: Maintained by <a href="https://trummelbummel.com">trummelbummel</a>.

nav:
  - Home: index.md
  - Modules: modules.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["src/auto_prompt"]
theme:
  name: material
  feature:
    tabs: true
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/trummelbummel/auto-prompt
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/auto-prompt

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
